<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Carta Virtual de La Sarita – Cocina Popular. Con mucha calle y sabor peruano. Pide para consumo en salón o delivery directamente por WhatsApp." />
  <meta name="theme-color" content="#9e2b25" />
  <title>La Sarita – Cocina Popular | Carta Virtual</title>

  <!-- Tipografías Google Fonts: Fraunces (Títulos con carácter) y Plus Jakarta Sans (Lectura clara) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Hojas de estilo modulares -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/menu.css" />
  <link rel="stylesheet" href="./css/cart.css" />
  <link rel="stylesheet" href="./css/checkout.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <!-- Cabecera Principal -->
  <header class="site-header no-print" id="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand" aria-label="La Sarita – Cocina Popular, ir al inicio">
        <div class="brand-text">
          <span class="brand-title">La Sarita</span>
          <span class="brand-subtitle">Cocina Popular</span>
        </div>
      </a>

      <div class="header-actions" id="header-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="open-qr-manager-btn" title="Códigos QR por mesa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="4" height="4"></rect>
            <path d="M18 18h3v3h-3z"></path>
          </svg>
          <span>QR Mesas</span>
        </button>

        <button type="button" class="header-cart-btn" id="header-cart-btn" aria-label="Ver pedido actual">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="header-cart-total">S/ 0.00</span>
          <span class="header-cart-count" id="header-cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content no-print" id="top">
    <div class="container">
      <!-- Banner de Bienvenida e Identidad + Selector Rápido de Modalidad -->
      <section class="hero-banner" aria-label="Presentación de La Sarita">
        <div class="hero-banner-content">
          <p class="hero-story">
            <strong>La Sarita - Cocina Popular</strong>, en honor a Sarita Colonia, hemos creado esta carta con mucha calle y sabor peruano. ¡Gracias por ser parte de esta historia!
          </p>
          <div class="hero-meta-bar" id="order-mode-bar">
            <div class="order-mode-Status" id="order-mode-indicator">
              <button type="button" class="mode-pill is-active" data-order-mode="salon" id="mode-btn-salon">
                <span>🍽️ Consumo en Salón</span>
              </button>
              <button type="button" class="mode-pill" data-order-mode="delivery" id="mode-btn-delivery">
                <span>🛵 Delivery</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Barra de Búsqueda -->
      <section class="search-bar-container" id="controls-section" aria-label="Buscar en la carta">
        <div class="search-input-wrapper">
          <span class="search-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <label for="catalog-search-input" class="sr-only">Buscar plato, bebida o ingrediente</label>
          <input
            type="search"
            id="catalog-search-input"
            class="search-input"
            placeholder="Buscar plato, alitas, lomo, pizza, bebida..."
            autocomplete="off"
          />
          <button type="button" id="catalog-search-clear" class="search-clear-btn" aria-label="Limpiar búsqueda" hidden>
            ✕
          </button>
        </div>
        <div id="search-feedback" class="search-feedback" aria-live="polite" hidden></div>
      </section>

      <!-- Navegación Sticky de las 13 Categorías Desplazables -->
      <div class="categories-sticky-bar">
        <nav class="categories-nav" id="categories-nav" aria-label="Categorías de la carta">
          <!-- Renderizado dinámicamente por menu.js -->
        </nav>
      </div>

      <!-- Catálogo Completo (13 Categorías, Productos y Promociones) -->
      <div id="catalog-section" aria-live="polite">
        <!-- Renderizado dinámicamente por menu.js -->
      </div>
    </div>
  </main>

  <!-- Modal de Personalización de Producto (FASE 4) -->
  <div id="product-modal-container" class="no-print" aria-live="polite"></div>

  <!-- Drawer / Modal del Carrito (FASE 5) -->
  <aside id="cart-drawer" class="cart-drawer no-print" aria-label="Tu pedido"></aside>

  <!-- Barra Flotante Inferior de Carrito en Móvil (FASE 5) -->
  <div id="floating-cart-bar" class="no-print" hidden></div>

  <!-- Modal de Checkout (FASE 6) -->
  <div id="checkout-modal" class="checkout-modal no-print" aria-label="Finalizar pedido"></div>

  <!-- Vista generadora e imprimible de Códigos QR por Mesa (FASE 8) -->
  <section id="qr-manager-modal" aria-label="Generador de códigos QR por mesa" hidden></section>

  <!-- Pie de página -->
  <footer class="site-footer no-print">
    <div class="container footer-inner">
      <div>
        <p class="brand-title">La Sarita</p>
        <p><strong>Cocina Popular Peruana</strong></p>
      </div>
      <div class="footer-social">
        <a
          href="https://www.instagram.com/LaSarita_cocinapopular"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-link-pill"
        >
          <span>📷 Instagram: @LaSarita_cocinapopular</span>
        </a>
        <a
          href="https://wa.me/51987090720"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-link-pill"
        >
          <span>💬 Pedidos WhatsApp: +51 987 090 720</span>
        </a>
      </div>
    </div>
  </footer>

  <!-- Módulos JS (compatibles tanto en Cloudflare Pages/HTTP como al abrir index.html localmente) -->
  <script defer src="./js/config.js"></script>
  <script defer src="./js/utils.js"></script>
  <script defer src="./js/menu.js"></script>
  <script defer src="./js/product-modal.js"></script>
  <script defer src="./js/cart.js"></script>
  <script defer src="./js/order-type.js"></script>
  <script defer src="./js/checkout.js"></script>
  <script defer src="./js/whatsapp.js"></script>
  <script defer src="./js/qr.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
